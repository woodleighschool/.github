---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate
run-name: Renovate (${{ (inputs.autodiscoverFilter == '*' && 'all repos') || inputs.autodiscoverFilter || 'all repos' }})

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: false
        required: false
        type: boolean
      autodiscoverFilter:
        description: Repository name, or * for every repository
        default: "*"
        required: false
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
      repoCache:
        description: Repository cache
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset

permissions:
  contents: read

concurrency:
  group: renovate-${{ inputs.autodiscoverFilter || 'scheduled' }}
  cancel-in-progress: false

jobs:
  # Each repository gets its own run and a token for that repository only,
  # because mise and go generate run the repository's own code beside it.
  fan-out:
    name: Fan Out
    if: ${{ (inputs.autodiscoverFilter || '*') == '*' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Start a run per repository
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dryRun == true }}
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          REPO_CACHE: ${{ inputs.repoCache || 'enabled' }}
        run: |
          # wood-ops runs its own Renovate.
          repos=$(GH_TOKEN="${APP_TOKEN}" gh api --paginate /installation/repositories \
            --jq '.repositories[] | select(.archived | not) | .name | select(. != "wood-ops")')
          for repo in ${repos}; do
            gh workflow run renovate.yaml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${GITHUB_REF_NAME}" \
              --field "autodiscoverFilter=${repo}" \
              --field "dryRun=${DRY_RUN}" \
              --field "logLevel=${LOG_LEVEL}" \
              --field "repoCache=${REPO_CACHE}"
          done

  renovate:
    name: Renovate
    if: ${{ (inputs.autodiscoverFilter || '*') != '*' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check repository name
        env:
          REPOSITORY: ${{ inputs.autodiscoverFilter }}
        run: |
          # The name also scopes the token, so a list or pattern is refused.
          if [[ ! "${REPOSITORY}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Expected a single repository name"
            exit 1
          fi

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.autodiscoverFilter }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-members: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Restore Renovate cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The package cache keeps GitHub tag and release lookups between runs,
          # so each run only asks GitHub for what changed.
          path: |
            /tmp/renovate/cache/renovate/repository
            /tmp/renovate/cache/renovate/renovate-cache-v1
          key: renovate-cache/${{ inputs.autodiscoverFilter }}/${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: renovate-cache/${{ inputs.autodiscoverFilter }}/

      - name: Align cache ownership for the Renovate container
        run: |
          sudo mkdir -p /tmp/renovate/cache/renovate/repository
          # Renovate runs in its container as uid 12021; give it ownership so it
          # can read and rewrite the restored cache.
          sudo chown -R 12021:0 /tmp/renovate

      - name: Renovate
        uses: renovatebot/github-action@f3a31a786096ba6b40d0f0ffe11a494ef73bfa7c # v46.3.4
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true }}
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository_owner }}/${{ inputs.autodiscoverFilter }}
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"MISE_TRUSTED_CONFIG_PATHS":"/tmp/renovate/repos"}'
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["goGenerate", "mise"]'
          RENOVATE_REPOSITORY_CACHE: ${{ inputs.repoCache || 'enabled' }}
          RENOVATE_PRESET_CACHE_PERSISTENCE: "true"
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Save Renovate cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/renovate/cache/renovate/repository
            /tmp/renovate/cache/renovate/renovate-cache-v1
          key: renovate-cache/${{ inputs.autodiscoverFilter }}/${{ github.run_id }}-${{ github.run_attempt }}
