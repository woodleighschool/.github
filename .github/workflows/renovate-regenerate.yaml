---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate Regenerate
run-name: Regenerate stemma-catalog PR ${{ inputs.pull-request }}

on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: Stemma catalog Renovate pull request number
        required: true
      head-sha:
        description: Pull request head commit to regenerate
        required: true

concurrency:
  group: renovate-regenerate-stemma-catalog-${{ inputs.pull-request }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_REPO: woodleighschool/stemma-catalog
  PR_NUMBER: ${{ inputs.pull-request }}
  HEAD_SHA: ${{ inputs.head-sha }}

jobs:
  regenerate:
    name: Regenerate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_NO_HOOKS: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Check Renovate pull request
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" | jq --exit-status --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" '
            .state == "open" and .user.login == "renovate[bot]" and
            .head.repo.full_name == $repo and .base.ref == "main" and .head.sha == $sha'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woodleighschool/stemma-catalog
          ref: ${{ inputs.head-sha }}
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install_args: --locked github:github/gh-aw

      - name: Compile
        run: mise run aw

      - name: Collect changes
        id: diff
        run: |
          git reset --quiet
          git add -- '.github/workflows/*.lock.yml' .github/aw/actions-lock.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > "${RUNNER_TEMP}/renovate-regenerate.patch"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-regenerate
          path: ${{ runner.temp }}/renovate-regenerate.patch
          retention-days: 1

  push:
    name: Push
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Read the PR again: the generator never controls the destination branch.
      - name: Check Renovate pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          pr=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")
          jq --exit-status --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" '
            .state == "open" and .user.login == "renovate[bot]" and
            .head.repo.full_name == $repo and .base.ref == "main" and .head.sha == $sha' <<< "$pr"
          jq --raw-output '"branch=\(.head.ref)"' <<< "$pr" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woodleighschool/stemma-catalog
          ref: ${{ inputs.head-sha }}
          persist-credentials: false

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renovate-regenerate
          path: ${{ runner.temp }}/renovate-regenerate

      # Dependency code only runs in the other job. This token also needs
      # workflows:write because the generated files are executable workflows.
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: woodleighschool
          repositories: stemma-catalog
          permission-contents: write
          permission-workflows: write

      - name: Commit and push
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ steps.pr.outputs.branch }}
        run: |
          git apply --include='.github/workflows/*.lock.yml' --include='.github/aw/actions-lock.json' \
            "${RUNNER_TEMP}/renovate-regenerate/renovate-regenerate.patch"
          git add -- '.github/workflows/*.lock.yml' .github/aw/actions-lock.json
          git diff --cached --quiet && exit 0
          user_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit --message 'chore(renovate): compile agentic workflows'
          gh auth setup-git
          git push origin "HEAD:refs/heads/${HEAD_REF}"
