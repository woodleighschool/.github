---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate Regenerate
run-name: Regenerate ${{ inputs.repository }} PR ${{ inputs.pull-request }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name within this organization
        required: true
      pull-request:
        description: Renovate pull request number
        required: true
      head-sha:
        description: Pull request head commit to regenerate
        required: true
      task:
        description: Mise task that regenerates the files
        required: true
      paths:
        description: Newline-separated git pathspecs of generated files to commit
        required: true
      tools:
        description: Optional space-separated mise tools to install
        required: false
      workflows:
        description: Request workflow-write permission for generated workflows
        type: boolean
        default: false

concurrency:
  group: renovate-regenerate-${{ inputs.repository }}-${{ inputs.pull-request }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REPOSITORY: ${{ inputs.repository }}
  GH_REPO: ${{ github.repository_owner }}/${{ inputs.repository }}
  PR_NUMBER: ${{ inputs.pull-request }}
  HEAD_SHA: ${{ inputs.head-sha }}

jobs:
  regenerate:
    name: Regenerate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.regenerate.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_NO_HOOKS: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Check Renovate pull request
        run: |
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+$ && "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" | jq --exit-status --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" '
            .state == "open" and .user.login == "renovate[bot]" and
            .head.repo.full_name == $repo and .base.ref == "main" and .head.sha == $sha'

      - name: Regenerate
        id: regenerate
        uses: $/actions/renovate-regenerate
        with:
          repository: ${{ inputs.repository }}
          head-sha: ${{ inputs.head-sha }}
          tools: ${{ inputs.tools }}
          task: ${{ inputs.task }}
          paths: ${{ inputs.paths }}

  push:
    name: Push
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Read the PR again: the generator never controls the destination branch.
      - name: Check Renovate pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+$ && "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          pr=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")
          jq --exit-status --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" '
            .state == "open" and .user.login == "renovate[bot]" and
            .head.repo.full_name == $repo and .base.ref == "main" and .head.sha == $sha' <<< "$pr"
          jq --raw-output '"branch=\(.head.ref)"' <<< "$pr" >> "$GITHUB_OUTPUT"

      - name: Push
        uses: $/actions/renovate-regenerate/push
        with:
          repository: ${{ inputs.repository }}
          head-sha: ${{ inputs.head-sha }}
          head-ref: ${{ steps.pr.outputs.branch }}
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-workflows: ${{ inputs.workflows && 'write' || '' }}
          paths: ${{ inputs.paths }}
