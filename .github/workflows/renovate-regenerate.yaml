---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate Regenerate
run-name: Regenerate ${{ inputs.repository }} PR ${{ inputs.pull-request }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name within this organization
        required: true
      pull-request:
        description: Renovate pull request number
        required: true
      head-sha:
        description: Pull request head commit to regenerate
        required: true

concurrency:
  group: renovate-regenerate-${{ inputs.repository }}-${{ inputs.pull-request }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REPOSITORY: ${{ inputs.repository }}
  GH_REPO: ${{ github.repository_owner }}/${{ inputs.repository }}
  PR_NUMBER: ${{ inputs.pull-request }}
  HEAD_SHA: ${{ inputs.head-sha }}

jobs:
  regenerate:
    name: Regenerate
    runs-on: ubuntu-26.04
    cache-mode: none
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.regenerate.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_NO_HOOKS: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Check Renovate pull request
        id: pr
        run: |
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+$ && "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" | jq --exit-status --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" '
            .state == "open" and .user.login == "renovate[bot]" and
            .head.repo.full_name == $repo and .base.ref == "main" and .head.sha == $sha'

          config=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GH_REPO}/contents/.github/renovate-regenerate.json?ref=main" |
            jq --compact-output --exit-status '
              {task, paths, tools: (.tools // ""), workflows: (.workflows // false)} |
              select((.task | type == "string" and length > 0) and
                (.paths | type == "array" and length > 0 and all(.[]; type == "string" and length > 0)) and
                (.tools | type == "string") and (.workflows | type == "boolean")) |
              .paths |= join("\n")')
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Regenerate
        id: regenerate
        uses: $/actions/renovate-regenerate
        with:
          repository: ${{ inputs.repository }}
          head-sha: ${{ inputs.head-sha }}
          tools: ${{ fromJSON(steps.pr.outputs.config).tools }}
          task: ${{ fromJSON(steps.pr.outputs.config).task }}
          paths: ${{ fromJSON(steps.pr.outputs.config).paths }}

  push:
    name: Push
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Read the PR and main's policy again; neither comes from the generator.
      - name: Check Renovate pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+$ && "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          pr=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")
          jq --exit-status --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" '
            .state == "open" and .user.login == "renovate[bot]" and
            .head.repo.full_name == $repo and .base.ref == "main" and .head.sha == $sha' <<< "$pr"
          jq --raw-output '"branch=\(.head.ref)"' <<< "$pr" >> "$GITHUB_OUTPUT"

          config=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GH_REPO}/contents/.github/renovate-regenerate.json?ref=main" |
            jq --compact-output --exit-status '
              {task, paths, tools: (.tools // ""), workflows: (.workflows // false)} |
              select((.task | type == "string" and length > 0) and
                (.paths | type == "array" and length > 0 and all(.[]; type == "string" and length > 0)) and
                (.tools | type == "string") and (.workflows | type == "boolean")) |
              .paths |= join("\n")')
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Push
        uses: $/actions/renovate-regenerate/push
        with:
          repository: ${{ inputs.repository }}
          head-sha: ${{ inputs.head-sha }}
          head-ref: ${{ steps.pr.outputs.branch }}
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-workflows: ${{ fromJSON(steps.pr.outputs.config).workflows && 'write' || '' }}
          paths: ${{ fromJSON(steps.pr.outputs.config).paths }}
