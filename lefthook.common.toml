[pre-commit]
parallel = true
skip = ["merge", "rebase"]

[pre-commit.commands.format-go]
glob = ["*.go"]
run = "gofmt -s -w {staged_files}"
stage_fixed = true

[pre-commit.commands.format-rust]
glob = ["*.rs"]
run = "cargo fmt --all"
stage_fixed = true

[pre-commit.commands.format-just]
glob = ["*.just", ".justfile"]
run = 'for f in {staged_files}; do just --justfile "$f" --fmt; done'
stage_fixed = true

# Format the config before locking it; concurrent rewrites can empty the lock.
[[pre-commit.jobs]]
name = "mise"
glob = [".mise/config.toml", ".mise/conf.d/*.toml"]

[pre-commit.jobs.group]
piped = true

[[pre-commit.jobs.group.jobs]]
name = "format-mise"
run = "mise fmt"
stage_fixed = true

[[pre-commit.jobs.group.jobs]]
name = "lock-mise"
run = 'mise lock && git add -A -- .mise ":(exclude).mise/*.toml"'

[pre-commit.commands.format-json]
glob = ["*.json", "*.json5", "*.jsonc"]
exclude = [".mise/locks/**"]
run = "oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.format-markdown]
glob = ["*.md", "*.markdown", "*.mdx"]
run = "oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.format-yaml]
glob = ["*.yaml", "*.yml"]
exclude = [".mise/locks/**"]
run = "oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.jactionlint]
glob = [
  ".github/workflows/*.{yaml,yml}",
  ".github/actions/**/action.{yaml,yml}",
  "actions/**/action.{yaml,yml}",
]
run = "jactionlint --shellcheck= {staged_files}"

[pre-commit.commands.shellcheck]
glob = ["*.sh"]
run = "shellcheck {staged_files}"
