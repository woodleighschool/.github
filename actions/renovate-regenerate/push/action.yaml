---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# Vendored from home-operations/.github; local changes are recorded in ../README.md.
name: Renovate Regenerate Push
description: Commit the patch from renovate-regenerate to the pull request branch as the GitHub App's bot user

inputs:
  repository:
    description: Repository name within the workflow's owner
    default: ${{ github.event.repository.name }}
  head-sha:
    description: Pull request head commit to apply the patch to
    default: ${{ github.event.pull_request.head.sha }}
  head-ref:
    description: Pull request branch to push
    default: ${{ github.event.pull_request.head.ref }}
  permission-workflows:
    description: Set to write when the generated files include GitHub workflows
  client-id:
    description: Client ID of the GitHub App that commits
    required: true
  private-key:
    description: Private key of the GitHub App that commits
    required: true
  paths:
    description: Newline-separated git pathspecs to commit from the patch; anything else in it is left out
    required: true

runs:
  using: composite
  steps:
    - name: Generate Token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.repository }}
        permission-contents: write
        permission-workflows: ${{ inputs.permission-workflows }}

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository_owner }}/${{ inputs.repository }}
        ref: ${{ inputs.head-sha }}
        persist-credentials: false

    - name: Download patch
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: renovate-regenerate
        path: ${{ runner.temp }}/renovate-regenerate

    # The patch comes from a job that ran dependency code. Only `paths` are
    # staged, so anything else it changes stays out of the commit.
    - name: Commit and push
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        HEAD_REF: ${{ inputs.head-ref }}
        PATHS: ${{ inputs.paths }}
      run: |
        git apply "${RUNNER_TEMP}/renovate-regenerate/renovate-regenerate.patch"
        sed '/^[[:space:]]*$/d' <<< "${PATHS}" | git add --pathspec-from-file=-
        user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
        git -c user.name="${APP_SLUG}[bot]" -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
          commit --message "chore(renovate): regenerate generated files"
        gh auth setup-git
        git push origin "HEAD:refs/heads/${HEAD_REF}"
