---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Apple Notarize
description: Notarize and staple a signed macOS app

inputs:
  app-path:
    description: Path to the signed macOS app bundle
    required: true
  issuer-id:
    description: App Store Connect API issuer ID
    required: true
  api-key-id:
    description: App Store Connect API key ID
    required: true
  api-private-key:
    description: App Store Connect API private key
    required: true

runs:
  using: composite
  steps:
    - name: Notarize and staple app
      shell: bash
      env:
        APP_PATH: ${{ inputs.app-path }}
        APPSTORE_ISSUER_ID: ${{ inputs.issuer-id }}
        APPSTORE_API_KEY_ID: ${{ inputs.api-key-id }}
        APPSTORE_API_PRIVATE_KEY: ${{ inputs.api-private-key }}
      run: |
        set -euo pipefail

        if [[ ! -d "${APP_PATH}" ]]; then
          echo "App bundle not found: ${APP_PATH}" >&2
          exit 1
        fi

        NOTARY_TEMP="$(mktemp -d "${RUNNER_TEMP}/apple-notarize.XXXXXX")"
        NOTARY_ARCHIVE="${NOTARY_TEMP}/app.zip"
        NOTARY_KEY_PATH="${NOTARY_TEMP}/AuthKey.p8"
        trap 'rm -rf "${NOTARY_TEMP}"' EXIT

        printf '%s' "${APPSTORE_API_PRIVATE_KEY}" > "${NOTARY_KEY_PATH}"
        chmod 600 "${NOTARY_KEY_PATH}"

        ditto -c -k --keepParent "${APP_PATH}" "${NOTARY_ARCHIVE}"

        xcrun notarytool submit "${NOTARY_ARCHIVE}" \
          --key "${NOTARY_KEY_PATH}" \
          --key-id "${APPSTORE_API_KEY_ID}" \
          --issuer "${APPSTORE_ISSUER_ID}" \
          --wait

        xcrun stapler staple "${APP_PATH}"
        xcrun stapler validate "${APP_PATH}"
